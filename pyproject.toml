[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acrf"
version = "0.2.0"
description = "Chamber-aware Rewiring Framework (CRF) — method core: aCAI_rel, classification rules, I/O column contracts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CRF project" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/XiaoceDai/acrf"
Repository = "https://github.com/XiaoceDai/acrf"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crf"]

[tool.setuptools.package-data]
crf = ["py.typed"]
